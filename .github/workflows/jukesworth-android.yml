name: Jukesworth Android build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the APKs to
        default: v5.1.2-jw1
        required: true
      build_number:
        description: Android versionCode (raise it for every new release so updates install over the old one)
        default: "1"
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: 3.35.2
          channel: master
          cache: true
          git-source: https://github.com/flutter/flutter.git
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare
        run: |
          printf 'ENABLE_UPDATE_CHECK=0\nHIDE_DONATIONS=0\nLASTFM_API_KEY=\nLASTFM_API_SECRET=\nRELEASE_CHANNEL=stable\n' > .env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Signing key (same key every release, from repo secrets)
        env:
          KS: ${{ secrets.JW_ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.JW_ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KS" | base64 --decode > android/app/jukesworth-release.p12
          printf '%s\n' "$KP" > android/key.properties
      - name: Build APKs
        run: |
          flutter build apk --release --flavor stable --build-name 5.1.2 --build-number ${{ inputs.build_number }}
          flutter build apk --release --flavor stable --split-per-abi --build-name 5.1.2 --build-number ${{ inputs.build_number }}
      - name: Package
        run: |
          mkdir dist; o=build/app/outputs/flutter-apk; v=5.1.2-jw1
          cp $o/app-stable-release.apk dist/jukesworth-$v-android-universal.apk
          cp $o/app-arm64-v8a-stable-release.apk dist/jukesworth-$v-android-arm64-v8a.apk
          cp $o/app-armeabi-v7a-stable-release.apk dist/jukesworth-$v-android-armeabi-v7a.apk
          cd dist; for f in *.apk; do sha256sum "$f" > "$f.sha256"; done; ls -l
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1); $AAPT dump badging jukesworth-$v-android-arm64-v8a.apk | grep -E "package:|application-label:|uses-permission" || true
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1); $APKSIGNER verify --print-certs jukesworth-$v-android-arm64-v8a.apk | grep -i sha-256
      - name: Clean up key
        if: always()
        run: rm -f android/app/jukesworth-release.p12 android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
